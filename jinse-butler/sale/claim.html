<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>锦瑟管家 · 激活码领取</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:linear-gradient(160deg,#16293f,#0e1d2e);color:#eaf1f8;min-height:100vh;padding:24px 16px;display:flex;flex-direction:column;align-items:center}
  .card{width:100%;max-width:420px;background:#1c3450;border:1px solid #2a4a6e;border-radius:16px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h1{font-size:20px;margin:0 0 4px;color:#f5a623;text-align:center}
  .sub{font-size:13px;color:#9fb3c8;text-align:center;margin-bottom:18px}
  .price{font-size:34px;font-weight:800;text-align:center;color:#fff;margin:6px 0}
  .price small{font-size:14px;color:#9fb3c8;font-weight:400}
  .btn{display:block;width:100%;padding:15px;margin:16px 0 6px;border:0;border-radius:12px;background:#f5a623;color:#16293f;font-size:17px;font-weight:700;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .hint{font-size:12px;color:#8aa0bb;text-align:center;margin-bottom:10px}
  .result{margin-top:14px;padding:16px;border:1px dashed #f5a623;border-radius:12px;background:#0e1d2e;text-align:center;display:none}
  .result .lab{font-size:12px;color:#9fb3c8}
  .code{font-size:22px;font-weight:800;letter-spacing:1px;color:#f5a623;margin:8px 0;word-break:break-all}
  .copy{font-size:13px;color:#7fb0d6;cursor:pointer}
  .count{font-size:12px;color:#8aa0bb;text-align:center;margin-top:14px}
  details{margin-top:18px;font-size:12px;color:#7c93ab}
  details summary{cursor:pointer;color:#9fb3c8}
  details p{line-height:1.6}
  code{background:#0e1d2e;padding:2px 5px;border-radius:4px;color:#f5a623}
</style>
</head>
<body>
  <div class="card">
    <h1>锦瑟管家 · 激活码</h1>
    <div class="sub">永久买断版解锁码</div>
    <div class="price">¥9.9 <small>一次付费 · 永久使用</small></div>
    <button class="btn" id="claim">我已付款，领取激活码</button>
    <div class="hint">付款后点上方按钮，系统自动发放，无需人工</div>
    <div class="result" id="result">
      <div class="lab">您的激活码（复制后在 App「我的」里输入）</div>
      <div class="code" id="code"></div>
      <span class="copy" id="copy">点击复制</span>
    </div>
    <div class="count" id="count"></div>
    <details>
      <summary>侯哥管理说明（客户请忽略）</summary>
      <p>本页码池已内置 <b>200</b> 个有效激活码，客户点击即随机分配一个并写入本机缓存防重复领取。<br>
      码池用尽后：运行 <code>gen_jinse_codes.mjs</code> 重新生成一批，把页面里的 <code>POOL</code> 数组替换为新码即可（需重新部署到 GitHub）。<br>
      ⚠️ 码池写在页面 JS 中属公开可见，请勿把整批码发到公开群；发现被刷可更换码段。</p>
    </details>
  </div>

const KEY="jinse_claimed_codes";
function claimed(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function showCount(){const el=document.getElementById("count");if(el)el.textContent="本设备已领取："+claimed().length+" 个";}
function claim(){
  const used=claimed();
  const avail=POOL.filter(c=>!used.includes(c));
  if(avail.length===0){alert("激活码已发放完毕，请联系「侯哥」补发");return;}
  const code=avail[Math.floor(Math.random()*avail.length)];
  used.push(code);localStorage.setItem(KEY,JSON.stringify(used));
  const r=document.getElementById("result");if(r)r.style.display="block";
  const cd=document.getElementById("code");if(cd)cd.textContent=code;
  showCount();
  const b=document.getElementById("claim");if(b)b.textContent="再领一个（多设备用）";
}
document.addEventListener("DOMContentLoaded",function(){
  const btn=document.getElementById("claim");if(btn)btn.addEventListener("click",claim);
  const cp=document.getElementById("copy");if(cp)cp.addEventListener("click",function(){
    const t=document.getElementById("code").textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(t);
    cp.textContent="已复制 ✓";setTimeout(function(){cp.textContent="点击复制";},1500);
  });
  showCount();
});

</body>
</html>
