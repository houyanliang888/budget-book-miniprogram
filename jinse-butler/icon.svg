<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#16293f"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.4" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#ffd884"/>
      <stop offset="0.55" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#e8730c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 柔光 -->
  <circle cx="256" cy="226" r="160" fill="url(#glow)"/>
  <!-- 锦瑟弦纹：几道优雅弧线环绕金币 -->
  <g fill="none" stroke="#ffd9a0" stroke-linecap="round">
    <path d="M86 150 Q256 64 426 150" stroke-width="8" stroke-opacity="0.55"/>
    <path d="M104 196 Q256 118 408 196" stroke-width="8" stroke-opacity="0.7"/>
    <path d="M120 360 Q256 268 392 360" stroke-width="8" stroke-opacity="0.8"/>
    <path d="M150 404 Q256 322 362 404" stroke-width="8" stroke-opacity="0.6"/>
  </g>
  <!-- 金币 -->
  <circle cx="256" cy="226" r="96" fill="url(#coin)"/>
  <circle cx="256" cy="226" r="96" fill="none" stroke="#fff3da" stroke-opacity="0.65" stroke-width="5"/>
  <!-- 货币符号 -->
  <text x="256" y="266" font-size="104" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700" fill="#7a3b00" text-anchor="middle">¥</text>
</svg>
