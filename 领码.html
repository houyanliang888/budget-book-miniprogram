<html lang="zh-CN">

<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:linear-gradient(160deg,#16293f,#0e1b2b);color:#eaf1f8;min-height:100vh;padding:24px 16px;display:flex;flex-direction:column;align-items:center}
  .card{width:100%;max-width:420px;background:#1d3450;border:1px solid #2c4a6e;border-radius:16px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h1{font-size:20px;margin:0 0 4px;color:#f58634;text-align:center}
  .sub{font-size:13px;color:#9fb3c8;text-align:center;margin-bottom:18px}
  .price{font-size:34px;font-weight:800;text-align:center;color:#fff;margin:6px 0}
  .price small{font-size:14px;color:#9fb3c8;font-weight:400}
  .btn{display:block;width:100%;padding:15px;margin:16px 0 6px;border:0;border-radius:12px;background:#f58634;color:#16293f;font-size:17px;font-weight:700;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .hint{font-size:12px;color:#8aa0b8;text-align:center;margin-bottom:10px}
  .result{margin-top:14px;padding:16px;border:1px dashed #f58634;border-radius:12px;background:#16293f;text-align:center;display:none}
  .result .lab{font-size:12px;color:#9fb3c8}
  .code{font-size:22px;font-weight:800;letter-spacing:1px;color:#f58634;margin:8px 0;word-break:break-all}
  .copy{font-size:13px;color:#7fd1a6;cursor:pointer}
  .count{font-size:12px;color:#8aa0b8;text-align:center;margin-top:14px}
  details{margin-top:18px;font-size:12px;color:#7c91a8}
  details summary{cursor:pointer;color:#9fb3c8}
  details p{line-height:1.6}
  code{background:#0e1b2b;padding:2px 5px;border-radius:4px;color:#f58634}
</style>
</head>

    <div class="sub">永久买断版解锁码</div>
    <div class="price">¥9.9 <small>一次付费 · 永久使用</small></div>
    <button class="btn" id="claim">我已付款，领取激活码</button>
    <div class="hint">付款后点上方按钮，系统自动发放，无需人工</div>
    <div class="result" id="result">
      <div class="lab">您的激活码（长按复制 / 在记账本「我的」里输入）</div>
      <div class="code" id="code"></div>
      <span class="copy" id="copy">点击复制</span>
    </div>
    <div class="count" id="count"></div>
    <details>
      <summary>侯哥管理说明（客户请忽略）</summary>
      <p>本页码池已内置 <b>100</b> 个有效激活码，客户点击即随机分配一个并写入本机缓存防重复领取。<br>
      码池用尽后：运行 <code>装修记账本\售卖\激活码批量生成.py</code> 重新生成一批，把下方 <code>POOL</code> 数组替换为新码即可（需重新部署到 GitHub）。<br>
      ⚠️ 码池写在页面 JS 中属公开可见，请勿把整批码发到公开群；发现被刷可更换码段。</p>
    </details>
  </div>

  function claim(){
    const used=claimed();

    r.style.display="block";
    document.getElementById("code").textContent=code;
    showCount();

  }
